name: Build CarVievo IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Xcode 16 Otomatik Sec
        run: |
          XCODE_YOLU=$(find /Applications -maxdepth 1 -name "Xcode_16*" | sort -V | tail -n 1)
          echo "Bulunan Xcode: $XCODE_YOLU"
          sudo xcode-select -s "$XCODE_YOLU/Contents/Developer"
          xcodebuild -version

      - name: XcodeGen Kur
        run: brew install xcodegen

      - name: Projeyi Olustur
        run: xcodegen generate

      - name: Derle
        run: |
          xcodebuild clean build \
            -project CarVievo.xcodeproj \
            -scheme CarVievo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: IPA Paketle
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/CarVievo.app Payload/
          zip -r CarVievo.ipa Payload

      - name: IPA Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: CarVievo-Unsigned-IPA
          path: CarVievo.ipa
